# Read by Streamlit Community Cloud and by `streamlit run streamlit_app.py`.
# The process working directory is the repository root.

[theme]
base = "light"
primaryColor = "#0B6E4F"
backgroundColor = "#F3F6F4"
secondaryBackgroundColor = "#E3EFE8"
textColor = "#14221E"
font = "sans serif"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
